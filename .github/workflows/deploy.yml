name: 'build -> push -> deploy'

# Deploy trigges av en release-tag, ikke av push til en branch.
# Tag-format: <dato>.release-<n>, f.eks. 2026-01-24.release-1.
# Bruk `bun run cut-release` (scripts/cut-release.ts) for å lage taggen.
on:
    push:
        tags:
            - '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].release-*'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        permissions:
            contents: read
            packages: write
        uses: TIHLDE/tihlde-workflows/.github/workflows/_ci_ghcr.yml@main
        with:
            context: .
            dockerfile: ./Dockerfile

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        uses: TIHLDE/tihlde-workflows/.github/workflows/_notify_deploy.yml@main
        secrets:
            DEPLOY_RECEIVER_TOKEN: ${{ secrets.DEPLOY_RECEIVER_TOKEN }}
